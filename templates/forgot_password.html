<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
<div class="auth-container" style="max-width:480px;">
    <div class="auth-card">
        <h3 class="text-center mb-3">Forgot Password</h3>
        <p class="text-muted text-center">Enter your email to generate a local reset link.</p>

        {% if message %}<div class="alert alert-success">{{ message }}</div>{% endif %}
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

        {% if reset_link %}
        <div class="alert alert-info">
            <strong>Reset Link</strong><br>
            <a href="{{ reset_link }}">{{ reset_link }}</a>
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control auth-input" required>
            </div>
            <button class="auth-btn">Generate Reset Link</button>
        </form>
        <div class="auth-footer">
            <a href="/login" class="auth-link">Back to Login</a>
        </div>
    </div>
</div>
</body>
</html>
