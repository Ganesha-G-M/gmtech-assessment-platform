<!DOCTYPE html>
<html>
<head>
    <title>Edit Question</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="dashboard-body">
<div class="container mt-5">
    <div class="auth-card mx-auto" style="max-width:650px;">
        <h3 class="text-center mb-4">Edit Question</h3>
        <form method="POST">
            <div class="mb-3"><label class="form-label">Question</label><textarea name="question" class="form-control" required>{{ question[2] }}</textarea></div>
            <div class="mb-3"><label class="form-label">Option 1</label><input type="text" name="option1" class="form-control" value="{{ question[3] }}" required></div>
            <div class="mb-3"><label class="form-label">Option 2</label><input type="text" name="option2" class="form-control" value="{{ question[4] }}" required></div>
            <div class="mb-3"><label class="form-label">Option 3</label><input type="text" name="option3" class="form-control" value="{{ question[5] }}" required></div>
            <div class="mb-3"><label class="form-label">Option 4</label><input type="text" name="option4" class="form-control" value="{{ question[6] }}" required></div>
            <div class="mb-3"><label class="form-label">Correct Option (1-4)</label><input type="number" name="correct_option" class="form-control" min="1" max="4" value="{{ question[7] }}" required></div>
            <button class="btn btn-primary w-100">Update Question</button>
        </form>
        <br>
        <a href="/manage_questions/{{ question[1] }}" class="btn btn-secondary w-100">Back to Questions</a>
    </div>
</div>
</body>
</html>
