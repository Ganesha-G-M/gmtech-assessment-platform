<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Certificate</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body{
            background:#f4f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            padding:40px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }
    </style>

</head>

<body>

<div class="card text-center">
    <h3>Verify Certificate</h3>
    <p>Enter Certificate ID</p>

    <form method="POST">
        <input type="number" name="cert_id" class="form-control mb-3" placeholder="Enter Certificate ID" required>
        <button type="submit" class="btn btn-primary w-100">Verify</button>
    </form>
</div>

</body>
</html>
