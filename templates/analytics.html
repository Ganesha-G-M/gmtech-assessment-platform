<!DOCTYPE html>
<html>

<head>

    <title>GMTech Analytics</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="dashboard-body">

<div class="container mt-5">

    <h2 class="text-center mb-4">GMTech Analytics Dashboard</h2>

    <div class="row text-center">

        <div class="col-md-4">

            <div class="card p-4 shadow">
                <h4>Total Users</h4>
                <h2>{{ users }}</h2>
            </div>

        </div>

        <div class="col-md-4">

            <div class="card p-4 shadow">
                <h4>Total Quizzes</h4>
                <h2>{{ quizzes }}</h2>
            </div>

        </div>

        <div class="col-md-4">

            <div class="card p-4 shadow">
                <h4>Total Attempts</h4>
                <h2>{{ attempts }}</h2>
            </div>

        </div>

    </div>


    <div class="mt-5">

        <canvas id="analyticsChart"></canvas>

    </div>


    <div class="text-center mt-4">

        <a href="/dashboard" class="btn btn-primary">
            Back to Dashboard
        </a>

    </div>

</div>


<script>

    const ctx = document.getElementById('analyticsChart');

    new Chart(ctx, {
    type: 'bar',
    data: {
    labels: ['Users', 'Quizzes', 'Attempts'],
    datasets: [{
    label: 'GMTech Platform Data',
    data: [{{ users }}, {{ quizzes }}, {{ attempts }}],
    borderWidth: 1
    }]
    },
    options: {
    scales: {
    y: {
    beginAtZero: true
    }
    }
    }
    });

</script>

</body>
</html>
