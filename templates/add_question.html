<!DOCTYPE html>
<html>

<head>

    <title>Add Question</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="dashboard-body">

<div class="container mt-5">

    <div class="auth-card mx-auto" style="max-width:600px;">

        <h3 class="text-center mb-4">Add Question</h3>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">Select Quiz</label>

                <select name="quiz_id" class="form-control" required>

                    {% for quiz in quizzes %}

                    <option value="{{ quiz[0] }}">
                        {{ quiz[1] }}
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">
                <label class="form-label">Question</label>
                <textarea name="question" class="form-control" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Option 1</label>
                <input type="text" name="option1" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Option 2</label>
                <input type="text" name="option2" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Option 3</label>
                <input type="text" name="option3" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Option 4</label>
                <input type="text" name="option4" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Correct Option (1-4)</label>
                <input type="number" name="correct_option" class="form-control" min="1" max="4" required>
            </div>

            <button class="btn btn-success w-100">
                Add Question
            </button>

        </form>

        <br>

        <a href="/dashboard" class="btn btn-secondary w-100">
            Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
