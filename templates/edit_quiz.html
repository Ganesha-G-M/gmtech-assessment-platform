<!DOCTYPE html>
<html>
<head>
    <title>Edit Quiz</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .proctor-toggle-card{
            position:relative;
            display:block;
            cursor:pointer;
            border:1px solid #dbe4f0;
            border-radius:18px;
            padding:16px 16px 16px 62px;
            background:linear-gradient(135deg, #f8fbff, #eef6ff);
            box-shadow:0 12px 28px rgba(15,23,42,0.06);
            margin-bottom:18px;
        }

        .proctor-toggle-card input{
            position:absolute;
            opacity:0;
            pointer-events:none;
        }

        .proctor-toggle-switch{
            position:absolute;
            left:16px;
            top:18px;
            width:34px;
            height:20px;
            border-radius:999px;
            background:#cbd5e1;
            transition:0.2s ease;
        }

        .proctor-toggle-switch:after{
            content:"";
            position:absolute;
            top:3px;
            left:3px;
            width:14px;
            height:14px;
            border-radius:50%;
            background:white;
            box-shadow:0 2px 6px rgba(15,23,42,0.2);
            transition:0.2s ease;
        }

        .proctor-toggle-card input:checked + .proctor-toggle-switch{
            background:#2563eb;
        }

        .proctor-toggle-card input:checked + .proctor-toggle-switch:after{
            transform:translateX(14px);
        }

        .proctor-toggle-title{
            display:block;
            font-weight:800;
            color:#0f172a;
            margin-bottom:4px;
        }

        .proctor-toggle-copy{
            display:block;
            color:#64748b;
            font-size:13px;
            line-height:1.45;
        }

        .proctor-toggle-badge{
            display:inline-flex;
            margin-top:10px;
            padding:5px 9px;
            border-radius:999px;
            background:#dbeafe;
            color:#1d4ed8;
            font-size:12px;
            font-weight:800;
        }
    </style>
</head>
<body class="dashboard-body">
<div class="container mt-5">
    <div class="auth-card mx-auto" style="max-width:560px;">
        <h3 class="text-center mb-4">Edit Quiz</h3>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Quiz Title</label>
                <input type="text" name="title" class="form-control" value="{{ quiz.title }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ quiz.description }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Time Limit (minutes)</label>
                <input type="number" name="time_limit" class="form-control" value="{{ quiz.time_limit }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Quiz Status</label>
                <select name="status" class="form-control" required>
                    <option value="active" {% if quiz.status == 'active' %}selected{% endif %}>Active</option>
                    <option value="upcoming" {% if quiz.status == 'upcoming' %}selected{% endif %}>Upcoming</option>
                    <option value="closed" {% if quiz.status == 'closed' %}selected{% endif %}>Closed</option>
                </select>
            </div>
            {% if supports_max_attempts %}
            <div class="mb-3">
                <label class="form-label">Max Attempts</label>
                <input type="number" name="max_attempts" class="form-control" min="1" value="{{ quiz.max_attempts or 1 }}" required>
            </div>
            {% endif %}
            {% if supports_proctoring %}
            <label class="proctor-toggle-card" for="proctoringRequired">
                <input type="checkbox" id="proctoringRequired" name="proctoring_required" {% if quiz.proctoring_required %}checked{% endif %}>
                <span class="proctor-toggle-switch"></span>
                <span class="proctor-toggle-title">Protected Recruitment Quiz</span>
                <span class="proctor-toggle-copy">Require camera proctoring only for this important quiz. Students must allow camera access before starting.</span>
                <span class="proctor-toggle-badge">Camera + phone detection</span>
            </label>
            {% else %}
            <div class="alert alert-info">Camera proctoring controls will appear after adding the <code>proctoring_required</code> column to the database.</div>
            {% endif %}
            <button class="btn btn-primary w-100">Update Quiz</button>
        </form>
        <br>
        <a href="/dashboard" class="btn btn-secondary w-100">Back to Dashboard</a>
    </div>
</div>
</body>
</html>
