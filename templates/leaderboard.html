<!DOCTYPE html>
<html>

<head>

    <title>{{ quiz_title }} Leaderboard</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-4">

    <h2 class="text-center">
        {{ quiz_title }} Leaderboard
    </h2>

    <table class="table table-striped">

        <tr>
            <th>Rank</th>
            <th>Student</th>
            <th>Score</th>
        </tr>

        {% for r in results %}

        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ r[0] }}</td>
            <td>{{ r[1] }} / {{ r[2] }}</td>
        </tr>

        {% endfor %}

    </table>

    <a href="/dashboard" class="btn btn-dark">
        Back
    </a>

</div>

</body>
</html>
