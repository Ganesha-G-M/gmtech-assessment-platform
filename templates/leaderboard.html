<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leaderboard - GMTech</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="leaderboard-body">

<div class="container leaderboard-container">

    <div class="leaderboard-card">

        <h2 class="leaderboard-title text-center">
            🏆 Top Performers
        </h2>

        <p class="leaderboard-subtitle text-center">
            GMTech Assessment Platform Leaderboard
        </p>

        <table class="table leaderboard-table">

            <thead>

            <tr>
                <th>Rank</th>
                <th>User</th>
                <th>Score</th>
            </tr>

            </thead>

            <tbody>

            {% for r in results %}

            <tr>

                <td>{{ loop.index }}</td>

                <td>{{ r[0] }}</td>

                <td>{{ r[1] }} / {{ r[2] }}</td>

            </tr>

            {% endfor %}

            </tbody>

        </table>

        <div class="leaderboard-actions">

            <a href="/dashboard" class="leaderboard-btn">
                Back to Dashboard
            </a>

        </div>

    </div>

</div>

</body>
</html>
