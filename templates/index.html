<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GMTech Assessment Platform</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="landing-body">

<nav class="landing-nav">

    <div class="container landing-nav-inner">

        <a class="landing-brand" href="/">
            <img src="{{ url_for('static', filename='images/GMTEC.jpeg') }}" class="landing-brand-logo" alt="GMTech">
            <span>GMTech</span>
        </a>

        <div class="landing-nav-actions">
            <a href="/login" class="landing-link">Login</a>
            <a href="/register" class="landing-outline-btn">Register</a>
        </div>

    </div>

</nav>

<main class="landing-main">

    <section class="container landing-hero landing-hero-center">

        <img src="{{ url_for('static', filename='images/GMTEC.jpeg') }}"
             class="landing-hero-logo"
             alt="GMTech">

        <h1 class="landing-title landing-title-center">
            GMTech Assessment Platform
        </h1>

        <p style="margin-top:10px; color:#555;">
            Practice quizzes, test your knowledge, and earn certificates.
        </p>

        <div class="landing-cta-group landing-cta-center">

            <!-- ✅ SINGLE LOGIN BUTTON -->
            <a href="/login" class="landing-primary-btn">Login</a>

            <!-- ✅ REGISTER -->
            <a href="/register" class="landing-outline-glow-btn">Create Account</a>

        </div>

    </section>

</main>

<footer class="footer">
    <p>&copy; 2026 GMTech Assessment Platform</p>
</footer>

</body>
</html>
