<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GMTech Quiz</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="quiz-body">

<div class="container quiz-container">

    <div class="quiz-card">

        <h2 class="quiz-title text-center">
            GMTech Quiz
        </h2>

        <p class="quiz-timer text-center">
            Time Left: <span id="timer"></span>
        </p>

        <form id="quizForm" method="POST" action="{{ url_for('submit_quiz', quiz_id=quiz_id) }}">

            {% if questions %}

            {% for q in questions %}

            <div class="question-block">

                <h5 class="question-text">
                    {{ loop.index }}. {{ q[2] }}
                </h5>

                <div class="option-list">

                    <label class="option-item">
                        <input type="radio" name="q{{ q[0] }}" value="1" required>
                        <span class="option-text">{{ q[3] }}</span>
                    </label>

                    <label class="option-item">
                        <input type="radio" name="q{{ q[0] }}" value="2">
                        <span class="option-text">{{ q[4] }}</span>
                    </label>

                    <label class="option-item">
                        <input type="radio" name="q{{ q[0] }}" value="3">
                        <span class="option-text">{{ q[5] }}</span>
                    </label>

                    <label class="option-item">
                        <input type="radio" name="q{{ q[0] }}" value="4">
                        <span class="option-text">{{ q[6] }}</span>
                    </label>

                </div>

            </div>

            <hr>

            {% endfor %}

            {% else %}

            <h4 class="text-center text-danger">
                No questions found for this quiz.
            </h4>

            {% endif %}

            <button type="submit" class="submit-quiz-btn">
                Submit Quiz
            </button>

        </form>

    </div>

</div>


<script>

    /* TIMER (Dynamic from Flask) */

    let time = {{ time_limit }};

    function updateTimer(){

    let minutes = Math.floor(time / 60);
    let seconds = time % 60;

    seconds = seconds < 10 ? "0" + seconds : seconds;

    document.getElementById("timer").innerText = minutes + ":" + seconds;

    }

    updateTimer();

    let timer = setInterval(function(){

    time--;

    updateTimer();

    if(time <= 0){
    clearInterval(timer);
    alert("Time is up!");
    document.getElementById("quizForm").submit();
    }

    },1000);


    /* FULLSCREEN MODE */

    function startFullscreen(){
    if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen();
    }
    }

    startFullscreen();


    /* TAB SWITCH DETECTION */

    document.addEventListener("visibilitychange", function(){

    if(document.hidden){
    alert("You switched tabs! Exam will be submitted.");
    document.getElementById("quizForm").submit();
    }

    });


    /* DISABLE RIGHT CLICK */

    document.addEventListener("contextmenu", function(e){
    e.preventDefault();
    });


    /* DISABLE COPY */

    document.addEventListener("copy", function(e){
    e.preventDefault();
    alert("Copying is not allowed during the exam.");
    });

</script>

</body>
</html>
