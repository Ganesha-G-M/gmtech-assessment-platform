<!DOCTYPE html>
<html>

<head>

    <title>Create Quiz</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="dashboard-body">

<div class="container mt-5">

    <div class="auth-card mx-auto" style="max-width:500px;">

        <h3 class="text-center mb-4">Create New Quiz</h3>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Quiz Title</label>
                <input type="text" name="title" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Time Limit (minutes)</label>
                <input type="number" name="time_limit" class="form-control" required>
            </div>

            <button class="btn btn-primary w-100">
                Create Quiz
            </button>

        </form>

        <br>

        <a href="/dashboard" class="btn btn-secondary w-100">
            Back to Dashboard
        </a>

    </div>

</div>

</body>
</html>
