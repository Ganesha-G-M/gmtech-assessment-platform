<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GMTech</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-body">

<div class="auth-container" style="max-width:460px;">
    <div class="auth-card">

        <div class="text-center">
            <img src="{{ url_for('static', filename='images/GMTEC.jpeg') }}" class="auth-logo">

            <h2 class="auth-title">Welcome Back</h2>

            <p class="auth-subtitle">Login to GMTech Assessment Platform</p>
        </div>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" class="auth-form">

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email"
                       class="form-control auth-input"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password"
                       class="form-control auth-input"
                       placeholder="Enter your password" required>
            </div>

            <!-- ❌ ROLE REMOVED (VERY IMPORTANT) -->

            <button type="submit" class="auth-btn">Login</button>

        </form>

        <div class="auth-footer">
            <p><a href="/forgot_password" class="auth-link">Forgot Password?</a></p>
            <p>Don't have an account?</p>
            <a href="/register" class="auth-link">Create Account</a>
        </div>

    </div>
</div>

</body>
</html>
