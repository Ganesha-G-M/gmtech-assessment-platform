<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
<div class="auth-container" style="max-width:480px;">
    <div class="auth-card">
        <h3 class="text-center mb-3">Reset Password</h3>

        {% if message %}<div class="alert alert-success">{{ message }}</div>{% endif %}
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}

        {% if not message %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" name="password" class="form-control auth-input" minlength="6" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control auth-input" minlength="6" required>
            </div>
            <button class="auth-btn">Update Password</button>
        </form>
        {% endif %}

        <div class="auth-footer">
            <a href="/login" class="auth-link">Back to Login</a>
        </div>
    </div>
</div>
</body>
</html>
